<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>세계 국기 여행 퀴즈</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background-color: #1e293b;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        @media (min-width: 500px) {
            #game-container {
                height: 92vh;
                border-radius: 24px;
                border: 2px solid #334155;
            }
        }

        /* 헤더 (게임 중 및 결과창에서만 표시) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            z-index: 20;
            border-bottom: 1px solid #334155;
            transition: all 0.3s ease;
        }

        header.hidden {
            display: none !important;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: #38bdf8;
        }

        .stat-value.timer {
            color: #f43f5e;
        }

        /* 화면 스크린 정의 */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px;
            z-index: 10;
        }

        .screen.active {
            display: flex;
        }

        /* 버튼 기본 스타일 */
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .btn-easy { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .btn-normal { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .btn-hard { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }

        /* 대기 화면 */
        #start-screen {
            justify-content: center;
            gap: 20px;
            text-align: center;
        }

        .title-group h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .title-group p {
            color: #94a3b8;
            font-size: 15px;
        }

        #earth-canvas {
            width: 240px;
            height: 240px;
            margin: 5px 0;
            border-radius: 50%;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.35);
        }

        /* 플레이 화면 */
        #play-screen {
            padding-top: 80px; /* 헤더 영역 확보 */
            justify-content: space-between;
        }

        /* 연출 배경 캔버스 */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .quiz-container {
            position: relative;
            z-index: 5;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .flag-card {
            width: 240px;
            height: 160px;
            background: #0f172a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 3px solid #334155;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flag-svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hint-badge {
            font-size: 13px;
            background: rgba(51, 65, 85, 0.8);
            padding: 6px 14px;
            border-radius: 20px;
            color: #cbd5e1;
            border: 1px solid #475569;
        }

        .input-group {
            position: relative;
            z-index: 5;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        .answer-input {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: 2px solid #334155;
            background: rgba(15, 23, 42, 0.9);
            color: white;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .answer-input:focus {
            border-color: #38bdf8;
        }

        /* 피드백 메시지 트랜지션 */
        .feedback {
            font-size: 18px;
            font-weight: 800;
            height: 24px;
            text-align: center;
            transition: opacity 0.2s ease;
            opacity: 0;
        }

        .feedback.correct {
            color: #4ade80;
            opacity: 1;
        }

        .feedback.wrong {
            color: #f87171;
            opacity: 1;
        }

        /* 결과 화면 */
        #result-screen {
            justify-content: center;
            gap: 24px;
            text-align: center;
            padding-top: 80px;
        }

        .result-box {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid #334155;
            padding: 30px 20px;
            border-radius: 24px;
            width: 100%;
        }

        .result-title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .result-score {
            font-size: 54px;
            font-weight: 900;
            color: #38bdf8;
            margin: 10px 0;
        }

        .result-desc {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 게임 진행 상황 표시 헤더 -->
    <header id="game-header" class="hidden">
        <div class="stat-box">
            <span class="stat-label">남은 시간</span>
            <span id="timer" class="stat-value timer">01:30</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">현재 점수</span>
            <span id="score" class="stat-value">0</span>
        </div>
    </header>

    <!-- 1. 대기 화면 -->
    <div id="start-screen" class="screen active">
        <div class="title-group">
            <h1>세계 국기 여행</h1>
            <p>국기를 보고 나라 이름을 맞혀보세요!</p>
        </div>
        <canvas id="earth-canvas" width="220" height="220"></canvas>
        <button id="start-btn" class="btn btn-primary">여행 시작하기</button>
    </div>

    <!-- 2. 난이도 선택 화면 -->
    <div id="difficulty-screen" class="screen">
        <div class="title-group">
            <h1>난이도 선택</h1>
            <p>도전할 난이도를 선택해 주세요.</p>
        </div>
        <div style="width: 100%; display: flex; flex-direction: column; gap: 12px; margin: auto 0;">
            <button class="btn btn-easy" onclick="startGame('easy')">쉬움 (대표적 국가)</button>
            <button class="btn btn-normal" onclick="startGame('normal')">중간 (세계 주요국)</button>
            <button class="btn btn-hard" onclick="startGame('hard')">어려움 (생소한 국가)</button>
        </div>
    </div>

    <!-- 3. 게임 플레이 화면 -->
    <div id="play-screen" class="screen">
        <canvas id="bg-canvas"></canvas>
        <div class="quiz-container">
            <div class="hint-badge" id="continent-hint">대륙: 아시아</div>
            <div class="flag-card" id="flag-box">
                <!-- SVG 국기가 여기에 렌더링됨 -->
            </div>
            <div class="feedback" id="feedback">정답입니다! +5점</div>
        </div>

        <div class="input-group">
            <input type="text" id="answer-input" class="answer-input" placeholder="나라 이름 입력" autocomplete="off">
            <button id="submit-btn" class="btn btn-primary">제출하기</button>
        </div>
    </div>

    <!-- 4. 결과 화면 -->
    <div id="result-screen" class="screen">
        <div class="result-box">
            <div id="result-title" class="result-title">미션 완료! 🎉</div>
            <div id="final-score" class="result-score">100</div>
            <p id="result-desc" class="result-desc">축하합니다! 100점을 달성하여 여행을 성공적으로 마쳤습니다.</p>
        </div>
        <button id="restart-btn" class="btn btn-primary">다시 도전하기</button>
    </div>
</div>

// 1. 대기 화면 실제 지형 지구 3D 연출 렌더러
const earthCanvas = document.getElementById('earth-canvas');
const earthCtx = earthCanvas.getContext('2d');
let earthAngle = 0;

// 사실적인 세계 주요 대륙 윤곽선 데이터 (경도, 위도 좌표)
const REAL_CONTINENTS = [
    // 아시아 / 유럽
    [[50,60],[140,65],[140,30],[100,10],[80,10],[60,25],[30,35],[10,50],[30,70]],
    // 아프리카
    [[-15,30],[35,30],[50,10],[40,-30],[15,-35],[0,5]],
    // 북아메리카
    [[-160,65],[-70,60],[-60,45],[-80,25],[-100,20],[-120,30],[-140,55]],
    // 남아메리카
    [[-80,10],[-35,0],[-40,-20],[-65,-50],[-75,-40],[-80,-10]],
    // 오세아니아
    [[115,-15],[150,-15],[145,-38],[115,-35]],
    // 그린란드
    [[-50,75],[-20,70],[-30,80],[-50,80]]
];

function drawEarth() {
    earthCtx.clearRect(0, 0, 240, 240);
    
    const centerX = 120;
    const centerY = 120;
    const radius = 100;

    // 바다 (입체 구체 클리핑 & 그라데이션)
    earthCtx.save();
    earthCtx.beginPath();
    earthCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    earthCtx.clip();

    let oceanGrad = earthCtx.createRadialGradient(centerX - 30, centerY - 30, 10, centerX, centerY, radius);
    oceanGrad.addColorStop(0, '#1d4ed8');
    oceanGrad.addColorStop(0.7, '#1e3a8a');
    oceanGrad.addColorStop(1, '#0f172a');
    earthCtx.fillStyle = oceanGrad;
    earthCtx.fillRect(0, 0, 240, 240);

    // 실제 대륙 렌더링 (구면 회전 투영 계산)
    earthCtx.fillStyle = '#22c55e';
    earthCtx.strokeStyle = '#15803d';
    earthCtx.lineWidth = 1.5;

    REAL_CONTINENTS.forEach(continent => {
        earthCtx.beginPath();
        let hasPoint = false;

        continent.forEach((coord, idx) => {
            let lon = coord[0] + earthAngle; // 경도 회전
            let lat = coord[1]; // 위도

            // 3D 구면 투영 공식
            let radLon = (lon * Math.PI) / 180;
            let radLat = (lat * Math.PI) / 180;

            let x3d = Math.cos(radLat) * Math.sin(radLon);
            let y3d = Math.sin(radLat);
            let z3d = Math.cos(radLat) * Math.cos(radLon);

            // 전면에 위치한 점만 그리기
            if (z3d > -0.2) {
                let screenX = centerX + x3d * radius;
                let screenY = centerY - y3d * radius;

                if (!hasPoint) {
                    earthCtx.moveTo(screenX, screenY);
                    hasPoint = true;
                } else {
                    earthCtx.lineTo(screenX, screenY);
                }
            }
        });

        if (hasPoint) {
            earthCtx.closePath();
            earthCtx.fill();
            earthCtx.stroke();
        }
    });

    // 구체 음영 빛 효과 (하이라이트)
    let glossGrad = earthCtx.createRadialGradient(centerX - 35, centerY - 35, 5, centerX - 20, centerY - 20, radius);
    glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
    glossGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.05)');
    glossGrad.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
    earthCtx.fillStyle = glossGrad;
    earthCtx.fillRect(0, 0, 240, 240);

    earthCtx.restore();

    // 지구 테두리 반짝이는 대기 효과
    earthCtx.beginPath();
    earthCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    earthCtx.strokeStyle = '#38bdf8';
    earthCtx.lineWidth = 3;
    earthCtx.stroke();

    earthAngle += 0.8; // 자전 속도
    requestAnimationFrame(drawEarth);
}

// 2. 게임 시작
document.getElementById('start-btn').onclick = () => showScreen('difficulty-screen');
document.getElementById('restart-btn').onclick = () => showScreen('difficulty-screen');

function startGame(diff) {
    currentDifficulty = diff;
    score = 0;
    timeLeft = 90;
    
    // 선택한 난이도의 퀴즈 목록 복사 후 셔플
    currentQuizList = [...COUNTRY_DB[diff]].sort(() => Math.random() - 0.5);
    quizIndex = 0;

    scoreEl.textContent = score;
    updateTimerDisplay();

    showScreen('play-screen');
    nextQuiz();

    // 타이머 구동
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
            endGame(false);
        }
    }, 1000);
}

function updateTimerDisplay() {
    let min = Math.floor(timeLeft / 60);
    let sec = timeLeft % 60;
    timerEl.textContent = `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
}

// 3. 퀴즈 진행 및 영토 확대 렌더링
function nextQuiz() {
    if (score >= 100) {
        endGame(true);
        return;
    }

    if (quizIndex >= currentQuizList.length) {
        // 출제 나리가 부족하면 다시 셔플하여 보충
        currentQuizList = [...COUNTRY_DB[currentDifficulty]].sort(() => Math.random() - 0.5);
        quizIndex = 0;
    }

    currentTarget = currentQuizList[quizIndex++];
    continentHintEl.textContent = `대륙: ${currentTarget.hint}`;
    flagBoxEl.innerHTML = currentTarget.flag;
    answerInput.value = '';
    answerInput.focus();

    drawMapBackground(currentTarget.map);
}

// 영토 줌인 배경 연출
function drawMapBackground(coords) {
    const bgCanvas = document.getElementById('bg-canvas');
    bgCanvas.width = bgCanvas.clientWidth;
    bgCanvas.height = bgCanvas.clientHeight;
    const ctx = bgCanvas.getContext('2d');

    ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

    // 은은한 그리드 배경
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1;
    for(let x=0; x<bgCanvas.width; x+=40) {
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,bgCanvas.height); ctx.stroke();
    }
    for(let y=0; y<bgCanvas.height; y+=40) {
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(bgCanvas.width,y); ctx.stroke();
    }

    // 영토 윤곽선 그리기
    const centerX = bgCanvas.width / 2;
    const centerY = bgCanvas.height / 2.5;

    ctx.beginPath();
    coords.forEach((pt, idx) => {
        let x = centerX + pt[0] * 4;
        let y = centerY + pt[1] * 4;
        if(idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
    ctx.fill();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    ctx.stroke();
}

// 4. 정답 검사
function checkAnswer() {
    if (!currentTarget) return;

    const userAns = answerInput.value.trim().replace(/\s+/g, '');
    const targetAns = currentTarget.name.replace(/\s+/g, '');

    if (userAns === targetAns) {
        score += 5;
        scoreEl.textContent = score;
        showFeedback("정답입니다! +5점", true);
        
        if (score >= 100) {
            setTimeout(() => endGame(true), 500);
        } else {
            setTimeout(nextQuiz, 600);
        }
    } else {
        showFeedback("틀렸습니다! 다시 시도하세요.", false);
    }
}

function showFeedback(msg, isCorrect) {
    feedbackEl.textContent = msg;
    feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
    setTimeout(() => {
        feedbackEl.className = 'feedback';
    }, 1000);
}

submitBtn.onclick = checkAnswer;
answerInput.onkeyup = (e) => {
    if (e.key === 'Enter') checkAnswer();
};

// 5. 게임 종료 및 결과 처리
function gameOver(finalScore) {
    endGame(finalScore >= 100);
}

function endGame(isWin) {
    if (timerInterval) clearInterval(timerInterval);

    const resultTitle = document.getElementById('result-title');
    const finalScoreEl = document.getElementById('final-score');
    const resultDesc = document.getElementById('result-desc');

    finalScoreEl.textContent = score;

    if (isWin || score >= 100) {
        resultTitle.textContent = "미션 성공! 🎉";
        resultDesc.textContent = "축하합니다! 제한시간 내에 100점을 달성하셨습니다.";
    } else {
        resultTitle.textContent = "시간 종료! ⏱️";
        resultDesc.textContent = "아쉽네요! 제한시간이 종료되었습니다. 다시 도전해보세요!";
    }

    showScreen('result-screen');
}

// 실행 시작
window.onload = function() {
    drawEarth();
    showScreen('start-screen');
};
</script>
